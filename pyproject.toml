[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "single-cell-ibd-immune-atlas"
version = "0.2.0"
description = "Reproducible single-cell analysis of immune remodelling in inflammatory bowel disease."
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Shane Thomas" }]
dependencies = [
  "anndata>=0.10,<0.13",
  "gseapy>=1.1,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scanpy>=1.10,<1.13",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "seaborn>=0.13,<1",
  "streamlit>=1.36,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
immune-atlas-pseudobulk = "immune_atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
